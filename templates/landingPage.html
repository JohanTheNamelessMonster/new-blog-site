<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@3.0.0/dist/iconify-icon.min.js"></script>
    <script src={{iconKit}} crossorigin="anonymous"></script>
</head>

<body class="bg-black h-screen w-screen">
    {% import 'modules.jinja' as module%}
    {{module.navbar(values,urls)}}

    <div class="grid justify-center overflow-auto max-height-[500px] overflow-x-hidden">
        {% for post in posts%}
        {{module.postBox(post["Title"],post["Body"],post["createdAt"],post["_id"])}}
        {%- endfor %}
    </div>

    {{module.footer(socials,tools)}}
</body>
<script src="/static/index.js"></script>

</html>
