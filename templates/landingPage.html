<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G Nair</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src={{iconKit}} crossorigin="anonymous"></script>
</head>

<body class="bg-linear-to-r from-slate-700 via-slate-800 to-slate-950 h-[100vh] w-[100vw]">
    {% import 'modules.jinja' as module%}

    {{module.loadingPage()}}
    <video autoplay muted loop src="/static/spaceVid.mp4" id="backgroundVideo" type="video/mp4"></video>
    <div id="screen" class="h-screen max-w-screen overflow-y-auto overflow-x-hidden pb-8">
        {{module.navbar()}}

        <div id="postArea" class="grid items-center justify-center w-screen">
            {% for i in range(posts|length)%}
            {{module.postBox(posts[i]["Title"],posts[i]["Body"][0:15]+"...",dates[i][0],dates[i][1],posts[i]["_id"])}}
            {%- endfor %}
        </div>
    </div>
    <div id="menuList">
        {{module.pagesMenu(values,urls)}}
    </div>
</body>
<script src="/static/index.js"></script>
<script src="/static/styles.js"></script>

</html>
