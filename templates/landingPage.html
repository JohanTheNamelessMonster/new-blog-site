<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G Nair</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@3.0.0/dist/iconify-icon.min.js"></script>
    <script src={{iconKit}} crossorigin="anonymous"></script>
</head>

<body class="bg-linear-to-r from-slate-700 via-slate-800 to-slate-950 h-screen w-screen">
    {% import 'modules.jinja' as module%}
    {{module.navbar(values,urls)}}

    <div class="grid justify-center overflow-y-auto sm:max-h-[250px] lg:max-h-[525px] overflow-x-hidden">
        {% for i in range(posts|length)%}
        {{module.postBox(posts[i]["Title"],posts[i]["Body"],dates[i][0],dates[i][1],posts[i]["_id"])}}
        {%- endfor %}
    </div>

    {{module.footer(socials,tools)}}
</body>
<script src="/static/index.js"></script>

</html>
