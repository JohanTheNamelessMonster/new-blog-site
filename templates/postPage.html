<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goutham Nair</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@3.0.0/dist/iconify-icon.min.js"></script>
</head>

<body>
    {% import 'modules.jinja' as modules %}
    {{modules.navbar(values,urls)}}

    <div class="grid grid-rows-10 h-full bg-gray-950 content-center w-screen">
        <div class="border-b-4 border-dotted border-sky-500 text-center row-start-1 row-end-2 w-full">
            <h1 class="text-3xl text-white font-serif font-semibold">{{data["Title"]}}</h1>
        </div>
        <div class="row-start-2 row-end-3 text-left mb-4 w-full">
            <p class="text-xs text-white font-mono">{{data["createdAt"]}}</p><br>
            <p class="text-xs text-white font-mono">{{"Characters: " + (data["Body"]|length)|string}}</p>
        </div>
        <div class="border-2 border-gray-100 text-left max-h-[350px] row-start-3 row-end-6 w-full overflow-y-auto">
            {% for para in paragraphs %}
            <p class="text-lg text-white font-serif">{{para}}</p><br><br>
            {%- endfor %}
        </div>
    </div>

    {{modules.footer(socials,tools)}}
</body>

</html>
