<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goutham Nair - Post</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script id="MathJax-script" async src={{mJAXScript}}></script>
    <script src={{iconKit}} crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="bg-linear-to-r from-slate-700 via-slate-800 to-slate-950 content-center">
    {% import 'modules.jinja' as modules %}

    {{modules.loadingPage()}}
    <video autoplay muted loop src="/static/spaceVid.mp4" id="backgroundVideo"></video>
    <div id="screen" class="fadeUp">
        {{modules.navbar()}}
        <div class="grid w-full border-t-4 border-lime-700 fadeRight">
            <div class="text-center row-start-1 row-end-2 w-full">
                <h1 class="text-5xl text-white font-serif font-semibold">{{data["Title"]}}</h1>
            </div>
            <div class="row-start-2 row-end-3 text-left mb-4 w-full">
                <p class="text-lg text-white font-mono underline decoration-pink-600/50 decoration-4">
                    {{data["createdAt"]}}
                </p><br>
                <p class="text-lg text-white font-mono underline decoration-pink-600/50 decoration-4">{{"Characters: " +
                    (data["Body"]|length)|string}}</p>
            </div>
            <div class="w-[80vw]">
                {% for para in paragraphs %}
                <p class="text-2xl text-slate-600/75 underline decoration-indigo-600/25 font-serif">{{para}}</p>
                <br><br>
                {%- endfor %}
            </div>
        </div>
    </div>
    <div id="menuList">
        {{modules.pagesMenu(values,urls)}}
    </div>
</body>
<script src="/static/styles.js"></script>
<script src="/static/index.js"></script>

</html>
