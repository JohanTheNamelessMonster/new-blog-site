<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src={{iconKit}} crossorigin="anonymous"></script>
    <title>GNair - About Me</title>
</head>

<body class="bg-linear-to-r from-slate-700 via-slate-800 to-slate-950 h-screen overflow-x-hidden">
    {% import 'modules.jinja' as module %}

    <img src="/static/moon.jpg" id="backgroundImage">
    <div id="screen" class="scrollRegion">
        {{module.navbar()}} <br>
        <div>
            <h1 id="name">Goutham</h1><br>
            <h1 id="name" class="lg:pl-32 sm:pl-0">Nair</h1>
        </div> <br>

        <div id="infoRegion">
            <div id="infoBox">
                <h1 id="infoTitle">General Info</h1><br>
                <p id="infoText">Hello traveller!! You have crawled far enough along the world wide web to end in
                    the cold,dark,desolate and remote corner of my website.</p>
                <form action="/static/CV_Goutham_Nair.pdf">
                    <button id="infoButton">
                        <h1 id="infoTitle">View my CV</h1>
                    </button>
                </form>
            </div>
        </div>

    </div>
    <div id="menuList">
        {{module.pagesMenu(values,urls)}}
    </div>
</body>

<script src="/static/styles.js"></script>
<script src="/static/index.js"></script>


</html>
