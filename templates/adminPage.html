<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G Nair Admin</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src={{iconKit}} crossorigin="anonymous"></script>
</head>

<body class="bg-linear-to-r from-slate-700 via-slate-800 to-slate-950">
    {% import 'modules.jinja' as module %}

    {{module.loadingPage()}}
    <video autoplay disablepictureinpicture playsinline muted loop src="/static/spaceVid.mp4"
        id="backgroundVideo"></video>
    <div id="screen">
        {{module.navbar()}}

        <div id="adminBox" class="justify-center items-center grid">
            <div class="w-[60vw]">
                <input type="text" id="titleText" class="w-full text-center text-white text-xl font-serif h-4" placeholder="Title"> <hr>
            </div>
        </div>
        
        <div id="adminBox" class="justify-center items-center grid">
            <div class="w-[60vw]">
                <textarea id="bodyText" class="w-full text-center text-white font-serif text-3xl h-[100px]" placeholder="Type Away..."></textarea><hr>
            </div>
        </div>
        <div id="adminBox" class="justify-center items-center grid">
            <div class="w-[60vw]">
                <input type="text" id="oid" class="w-full text-center text-black font-serif text-xl h-4" placeholder="Page Identifier"><hr>
            </div>
        </div>
        <div id="adminBox" class="justify-center items-center grid">
            <div class="w-[60vw]">
                <input type="password" id="password" class="w-full text-center text-white text-xl font-serif h-4" placeholder="Password"><hr>
            </div>
        </div>
        <div id="adminBox">
            <div class="w-full flex flex-row">
                <div class="w-full justify-center flex">
                    <label for="homePage" class="mr-4">Home Page</label>
                    <input name="targPage" type="radio" id="homePage" class="postPage" value="Home">
                </div>
                <div class="w-full justify-center flex">
                    <label for="notesPage" class="mr-4">NotesPage</label>
                    <input name="targPage" type="radio" id="notesPage" class="postPage" value="Notes">
                </div>
            </div> <br>
            <div class="w-full flex flex-row">
                <div class="w-full justify-center flex">
                    <label for="create" class="mr-4">CREATE</label>
                    <input name="command" type="radio" id="create" class="command" value="CREATE">
                </div>
                <div class="w-full justify-center flex">
                    <label for="update" class="mr-4">UPDATE</label>
                    <input name="command" type="radio" id="update" class="command" value="UPDATE">
                </div>
                <div class="w-full justify-center flex">
                    <label for="delete" class="mr-4">DELETE</label>
                    <input name="command" type="radio" id="delete" class="command" value="DELETE">
                </div>
            </div>
        </div>
        <div>
            <button id="submit" class="h-[10vh] w-[25vw] bg-violet-600 text-white mt-4 border-4 border-purple-500 rounded-lg min-h-[30px]">Submit</button>
        </div>
    </div>

    <div id="menuList">
        {{module.pagesMenu(values,urls)}}
    </div>
</body>

<script src="/static/postMaker.js"></script>
<script src="/static/styles.js"></script>
<script src="/static/index.js"></script>

</html>
